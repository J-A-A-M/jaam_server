# Dedicated dev-only nginx, lives entirely in docker-compose.dev.yml's jaam-dev network/stack -
# separate container, separate config from prod's nginx/nginx.conf (which this never touches).
# Only job right now: proxy dev-ws-direct.jaam.net.ua:8081 (plain ws://, grey-cloud DNS record
# straight to Server 2 - not routed through the dev Cloudflare Tunnel, same reasoning as prod's
# ws.jaam.net.ua) to websocket_server_dev. No CF-Connecting-IP check - this hostname isn't
# Cloudflare-proxied, real client IPs arrive directly.

user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    #Websocket DEV server (isolated dev nginx - see file header)
    server {
        listen 8081;

        proxy_socket_keepalive on;

        location / {
            proxy_pass http://map_websocket_server_dev:38447;
            proxy_http_version 1.1;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            send_timeout 3600;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Connection-Secure "false";
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
