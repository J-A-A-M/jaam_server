name: 📊 Deploy Admin Panel
on:
  push:
    branches: [master, develop]
    paths:
      - 'admin_panel/**'
      - 'redeploy_admin_panel.sh'
      - '.github/workflows/deploy_admin_panel.yml'
  workflow_dispatch:
    inputs:
      server_choice:
        type: choice
        default: 'Server 1'
        description: Choose server
        options:
          - 'Server 1'
          - 'Server 2'
      collect_interval:
        type: number
        description: "Redis scan interval (seconds)"
        default: 20
      logging:
        type: choice
        description: "Log level"
        required: true
        default: "INFO"
        options:
          - DEBUG
          - INFO
          - WARNING
          - CRITICAL
          - ERROR

run-name: Deploy Admin Panel from '${{ github.ref_name }}' branch
permissions:
  contents: read
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - name: Setup Node
            uses: actions/setup-node@v4
            with:
              node-version: '22'
          - name: Install frontend deps
            working-directory: admin_panel/frontend
            run: npm ci
          - name: Frontend typecheck
            id: typecheck
            working-directory: admin_panel/frontend
            run: npm run typecheck
            continue-on-error: true
          - name: Frontend unit tests
            id: fe_tests
            working-directory: admin_panel/frontend
            run: npm run test:run -- --reporter=default --reporter=json --outputFile=vitest-results.json
            continue-on-error: true
          - name: Setup Python
            uses: actions/setup-python@v5
            with:
              python-version: '3.12'
          - name: Backend admin_panel unit tests
            id: be_tests
            run: |
              pip install -r admin_panel/backend/requirements.txt pytest
              cd tests && python -m pytest admin_panel/ -v --junitxml=../pytest-results.xml
            continue-on-error: true
          - name: Test results summary
            if: always()
            env:
              TYPECHECK: ${{ steps.typecheck.outcome }}
            run: python3 .github/scripts/test_summary.py >> "$GITHUB_STEP_SUMMARY"
          - name: Fail if any suite failed
            if: always()
            run: |
              [ "${{ steps.typecheck.outcome }}" = "success" ] \
                && [ "${{ steps.fe_tests.outcome }}" = "success" ] \
                && [ "${{ steps.be_tests.outcome }}" = "success" ]

    deploy_admin_panel:
        needs: test
        runs-on: ubuntu-latest
        env:
          SERVER_IP: ${{ inputs.server_choice == 'Server 1' && secrets.CLOUD_SERVER_IP || secrets.CLOUD_SERVER_2_IP }}
          SERVER_USER: ${{ inputs.server_choice == 'Server 1' && secrets.CLOUD_SERVER_USER || secrets.CLOUD_SERVER_2_USER }}
          SERVER_SSH_KEY: ${{ inputs.server_choice == 'Server 1' && secrets.CLOUD_SERVER_SSH_KEY || secrets.CLOUD_SERVER_2_SSH_KEY }}
        steps:
          - name: Redeploy Admin Panel
            uses: appleboy/ssh-action@v1.2.0
            env:
              REDIS_HOSTS: ${{ secrets.ADMIN_PANEL_REDIS_HOSTS }}
              REDIS_HOST: ${{ secrets.CLOUD_REDIS_HOST }}
              REDIS_PASSWORD: ${{ secrets.CLOUD_REDIS_PASSWORD }}
              DB_PASSWORD: ${{ secrets.ADMIN_PANEL_DB_PASSWORD }}
              JWT_SECRET: ${{ secrets.ADMIN_PANEL_JWT_SECRET }}
              COLLECT_INTERVAL: ${{ inputs.collect_interval || 20 }}
              LOG_LEVEL: ${{ inputs.logging || 'INFO' }}
              REF_NAME: ${{ github.ref_name }}
              REPO: ${{ github.repository }}
            with:
              host: ${{ env.SERVER_IP }}
              username: ${{ env.SERVER_USER }}
              key: ${{ env.SERVER_SSH_KEY }}
              envs: REDIS_HOSTS,REDIS_HOST,REDIS_PASSWORD,DB_PASSWORD,JWT_SECRET,COLLECT_INTERVAL,LOG_LEVEL,REF_NAME,REPO
              script: |
                set -euo pipefail
                TEMP_DIR=$(mktemp -d)
                trap 'rm -rf "$TEMP_DIR"' EXIT
                cd "$TEMP_DIR"
                git clone --branch "$REF_NAME" "https://github.com/$REPO.git" .
                DB_PASSWORD_ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['DB_PASSWORD'],safe=''))")
                DB_URL="postgresql+asyncpg://jaam:${DB_PASSWORD_ENC}@postgres:5432/jaam_admin"
                if [ -n "$REDIS_HOSTS" ]; then
                  bash redeploy_admin_panel.sh \
                    -rh "$REDIS_HOSTS" \
                    -d "$DB_URL" \
                    -s "$JWT_SECRET" \
                    -ci "$COLLECT_INTERVAL" \
                    -cs true \
                    -l "$LOG_LEVEL"
                else
                  bash redeploy_admin_panel.sh \
                    -m "$REDIS_HOST" \
                    -pw "$REDIS_PASSWORD" \
                    -d "$DB_URL" \
                    -s "$JWT_SECRET" \
                    -ci "$COLLECT_INTERVAL" \
                    -cs true \
                    -l "$LOG_LEVEL"
                fi
          - name: Clear unused images
            uses: appleboy/ssh-action@v1.2.0
            with:
              host: ${{ env.SERVER_IP }}
              username: ${{ env.SERVER_USER }}
              key: ${{ env.SERVER_SSH_KEY }}
              script: |
                docker image prune -f
