    # JAAM Store HTTP
    server {
        listen 80;
        server_name store.jaam.net.ua;

        # Block clients without CF-Connecting-IP header
        if ($http_cf_connecting_ip = "") {
            return 403;
        }

        location / {
            proxy_pass http://map_store:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10m;
        }
    }

    # JAAM Store HTTPS
    server {
        listen 443 ssl;
        http2   on;
        server_name store.jaam.net.ua;

        # Block clients without CF-Connecting-IP header
        if ($http_cf_connecting_ip = "") {
            return 403;
        }

        # SSL certificates (provided by Cloudflare Origin CA)
        ssl_certificate /etc/nginx/ssl/cloudflare.crt;
        ssl_certificate_key /etc/nginx/ssl/cloudflare.key;

        ssl_trusted_certificate /etc/nginx/ssl/cloudflare_intermediate.crt;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;

        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";

        location / {
            proxy_pass http://map_store:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10m;
        }
    }
